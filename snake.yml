
name: Cobrinha das contribuicoes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar cobrinha rosa
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: annamelx
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f48ac5&color_dots=#171120,#48315b,#713d89,#b65cab,#f092ca

      - name: Publicar cobrinha
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
